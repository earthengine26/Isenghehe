<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ning-Ning Poke</title>
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            /* Menggunakan dvh (Dynamic Viewport Height) agar pas banget di layar HP modern */
            height: 100dvh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Emotikon Ngeledek di Pojok Kanan Bawah (Ukuran aman untuk layar HP & Laptop) */
        .mocking-emoji {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 10px);
            right: env(safe-area-inset-right, 10px);
            font-size: clamp(4rem, 15vw, 11rem);
            opacity: 0.22;
            pointer-events: none;
            z-index: 1;
            line-height: 1;
        }

        /* Teks Utama di Tengah Screen */
        .main-text {
            font-size: clamp(1.1rem, 4.5vw, 2.5rem);
            font-weight: 600;
            color: #8b949e;
            text-align: center;
            letter-spacing: 0.5px;
            padding: 0 24px;
            z-index: 2;
        }

        /* Teks Pojok Kanan Bawah (Aman dari area navigasi bawah HP modern) */
        .bottom-right-text {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            font-size: clamp(0.9rem, 3.8vw, 1.8rem);
            font-weight: 700;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
            animation: pulse 2s infinite alternate;
            z-index: 3;
            text-align: right;
            max-width: 75%;
        }

        /* Animasi Efek Glow/Pulse */
        @keyframes pulse {
            0% {
                opacity: 0.7;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>

    <!-- Emotikon Ngeledek (Background Pojok Kanan Bawah) -->
    <div class="mocking-emoji">😜</div>

    <!-- Teks Utama -->
    <div class="main-text">
        Baca di bawah pojok kanan
    </div>

    <!-- Teks Pojok Kanan Bawah -->
    <div class="bottom-right-text">
        Ning-Ning Poke
    </div>

</body>
</html>
