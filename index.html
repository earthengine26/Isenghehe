<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ning-Ning Poke</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Tidak ada overflow/height khusus di html & body, biar scroll bawaan browser jalan normal */
        html, body {
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .page {
            position: relative;
            width: 100%;
            /* --app-height diisi JS dari tinggi layar yang benar-benar terlihat */
            min-height: 100vh;
            min-height: 100svh;
            min-height: var(--app-height, 100svh);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            /* ruang ekstra di bawah supaya tidak ketutup bar navigasi/gesture HP */
            padding-bottom: max(56px, env(safe-area-inset-bottom));
        }

        .main-text {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.1rem, 4vw + 0.5rem, 2.5rem);
            font-weight: 600;
            color: #8b949e;
            text-align: center;
            letter-spacing: 0.5px;
            line-height: 1.4;
            overflow-wrap: break-word;
            position: relative;
            z-index: 2;
        }

        .footer {
            position: relative;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            min-height: clamp(4rem, 22vmin, 11rem);
            padding-top: 16px;
        }

        .mocking-emoji {
            position: absolute;
            right: 0;
            bottom: 0;
            font-size: clamp(3.5rem, 22vmin, 11rem);
            opacity: 0.22;
            pointer-events: none;
            line-height: 1;
            z-index: 1;
        }

        .bottom-right-text {
            position: relative;
            z-index: 3;
            font-size: clamp(0.9rem, 3vw + 0.4rem, 1.8rem);
            font-weight: 700;
            color: #58a6ff;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
            text-align: right;
            max-width: 100%;
            transform-origin: right bottom;
            animation: pulse 2s infinite alternate;
            padding: 0 4px 4px 0;
        }

        @keyframes pulse {
            0%   { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1;   transform: scale(1.05); }
        }

        @media (max-height: 480px) {
            .main-text { font-size: clamp(1rem, 3vw, 1.6rem); }
            .footer { min-height: 3rem; }
            .mocking-emoji { font-size: clamp(2.5rem, 18vmin, 5rem); }
        }

        @media (prefers-reduced-motion: reduce) {
            .bottom-right-text { animation: none; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="main-text">Baca di bawah pojok kanan</div>

        <div class="footer">
            <div class="mocking-emoji">😜</div>
            <div class="bottom-right-text">Ning-Ning Poke</div>
        </div>
    </div>

    <script>
        // Ambil tinggi layar yang benar-benar terlihat (beda-beda tiap HP/browser)
        function setAppHeight() {
            var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
            document.documentElement.style.setProperty('--app-height', h + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
    </script>
</body>
</html>
